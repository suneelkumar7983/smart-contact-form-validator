<style>
  body {
    font-family: sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    padding-top: 30px;
  }
  .form-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    width: 90%;
    max-width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .input-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 14px;
  }
  input, textarea {
    width: 92%;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    font-family: sans-serif;
  }
  input.error-border, textarea.error-border {
    border-color: #d9534f;
  }
  .error-text {
    color: #d9534f;
    font-size: 12px;
    margin-top: 4px;
    display: none;
  }
  .error-text.show {
    display: block;
  }
  button {
    width: 100%;
    background-color: #007bff;
    color: white;
    border: none;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .success-box {
    display: none;
    background: #eef7f2;
    color: #28a745;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
  }
</style>

<div class="form-card">
  <form id="lead-form">
    <h2>Request a Free Quote</h2>

    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="name-input" placeholder="e.g. Rahul Sharma">
      <div id="name-error" class="error-text">Please enter your full name.</div>
    </div>

    <div class="input-group">
      <label>Work Email</label>
      <input type="text" id="email-input" placeholder="e.g. rahul@company.com">
      <div id="email-error" class="error-text">Please enter a valid email address.</div>
    </div>

    <div class="input-group">
      <label>Project Details</label>
      <textarea id="msg-input" rows="3" placeholder="Tell us about your project (min 10 chars)..."></textarea>
      <div id="msg-error" class="error-text">Please enter at least 10 characters.</div>
    </div>

    <button type="submit">Send Inquiry</button>
  </form>

  <div id="success-message" class="success-box">
    <h3>✅ Inquiry Sent!</h3>
    <p>Thank you, <span id="user-display"></span>. We will contact you within 24 hours.</p>
  </div>
</div>

<script>
  const form = document.getElementById('lead-form');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const nameInput = document.getElementById('name-input');
    const emailInput = document.getElementById('email-input');
    const msgInput = document.getElementById('msg-input');

    const nameVal = nameInput.value.trim();
    const emailVal = emailInput.value.trim();
    const msgVal = msgInput.value.trim();

    let isValid = true;

    // 1. Validate Name
    if (nameVal === '') {
      nameInput.classList.add('error-border');
      document.getElementById('name-error').classList.add('show');
      isValid = false;
    } else {
      nameInput.classList.remove('error-border');
      document.getElementById('name-error').classList.remove('show');
    }

    // 2. Validate Email
    if (!emailVal.includes('@') || !emailVal.includes('.')) {
      emailInput.classList.add('error-border');
      document.getElementById('email-error').classList.add('show');
      isValid = false;
    } else {
      emailInput.classList.remove('error-border');
      document.getElementById('email-error').classList.remove('show');
    }

    // 3. Validate Message Length
    if (msgVal.length < 10) {
      msgInput.classList.add('error-border');
      document.getElementById('msg-error').classList.add('show');
      isValid = false;
    } else {
      msgInput.classList.remove('error-border');
      document.getElementById('msg-error').classList.remove('show');
    }

    // 4. Show Success Screen if Everything Passes
    if (isValid) {
      form.style.display = 'none';
      document.getElementById('user-display').innerText = nameVal;
      document.getElementById('success-message').style.display = 'block';
    }
  });
</script>
